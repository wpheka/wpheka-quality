project_type: wordpress-plugin

php:
  minimum: "7.4"

wordpress:
  required: true

checks:
  php_syntax: true
  git_diff_check: true
  phpcs: true
  phpstan: true
  phpunit: true
  composer_validate: true
  composer_audit: true
  semgrep: true
  gitleaks: true
  plugin_check: true
  coderabbit: true
  npm_lint: false
  npm_test: false
