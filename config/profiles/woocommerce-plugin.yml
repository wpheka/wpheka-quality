project_type: woocommerce-plugin

php:
  minimum: "8.1"

wordpress:
  required: true

woocommerce:
  required: true
  hpos: true
  blocks: true

checks:
  php_syntax: true
  git_diff_check: true
  phpcs: true
  phpstan: true
  phpunit: true
  composer_validate: true
  composer_audit: true
  semgrep: true
  gitleaks: true
  plugin_check: true
  coderabbit: true
  npm_lint: false
  npm_test: false
